<!doctype html>
<!--
  Les carrousels TikTok « 6 reasons… » (2026-11-24, le propriétaire : « fais-moi le même type de carrousel adapté à la carte
  Random Japan Place », d'après un carrousel « 6 raisons de jouer à … » vu sur TikTok). Trois carrousels de 8 images 1080 × 1440
  (3:4, entières à l'écran sous la légende de TikTok) : la carte, la balade 3D, le jeu « Guess the place ». Le format de
  l'exemple (une couverture sombre, puis une raison par image, sombre et clair en alternance, un quadrillage, le numéro en haut
  et en bas, un titre dans un bandeau collé au bord gauche avec des mots en couleur, des personnages en autocollants), aux
  couleurs de la carte (DESIGN.md : le papier, l'encre sépia, le rouge du cartographe, Zen Antique) ; la balade a ses bandeaux
  à elle (la boîte de dialogue du jeu : papier crème, trait d'encre, filet rouge, M PLUS Rounded 1c).
  Une image : carrousels.html?c=carte&n=0 (rendre.py les photographie toutes).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carrousels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Noto+Sans:wght@700;800;900&family=M+PLUS+Rounded+1c:wght@800;900&display=block" rel="stylesheet">
<style>
  :root {
    --papier: #f3e8cf; --nuit: #221912; --encre: #35251a; --rouge: #a8321f; --vif: #ec6342; --trait: #8a6b45; --creme: #fbf6ea;
    --sans: 'Noto Sans', sans-serif; --titre: 'Zen Antique', serif; --rond: 'M PLUS Rounded 1c', sans-serif;
  }
  html, body { margin: 0; background: #000; }
  .image { width: 1080px; height: 1440px; position: relative; overflow: hidden; font-family: var(--sans); }
  .clair { background: var(--papier); color: var(--encre); }
  .sombre { background: var(--nuit); color: var(--creme); }
  .grille { position: absolute; inset: 0; background-image: linear-gradient(to right, var(--g) 2px, transparent 2px), linear-gradient(to bottom, var(--g) 2px, transparent 2px); background-size: 135px 135px; background-position: 66px 44px; }
  .clair .grille { --g: rgba(138, 107, 69, 0.27); }
  .sombre .grille { --g: rgba(205, 170, 120, 0.15); }
  .grain { position: absolute; inset: 0; background: url(../../../videos/carte/carrousels/images/grain.jpg) center / cover; mix-blend-mode: multiply; opacity: 0.32; }
  .sombre .grain { mix-blend-mode: screen; opacity: 0.05; }
  .halo { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.35) 100%); }
  .clair .halo { background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 60%, rgba(90,60,20,0.16) 100%); }

  .num { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--titre); font-size: 64px; line-height: 1; color: #b0905f; }
  .sombre .num { color: #8f7550; }
  .num.haut { top: 30px; } .num.bas { bottom: 30px; }

  /* le bandeau du titre, collé au bord gauche */
  .titre { position: absolute; left: 0; top: 128px; padding: 32px 54px 38px 66px; max-width: 800px; box-sizing: border-box; font-weight: 800; font-size: 63px; line-height: 1.13; letter-spacing: -0.6px; z-index: 5; }
  .clair .titre { background: rgba(229, 212, 173, 0.95); }
  .sombre .titre { background: rgba(10, 6, 4, 0.7); }
  .titre em { font-style: normal; color: var(--rouge); }
  .sombre .titre em { color: var(--vif); }
  /* la balade : la boîte de dialogue du jeu */
  .balade .titre { font-size: 58px; font-family: var(--rond); font-weight: 800; letter-spacing: -0.3px; background: var(--creme) !important; color: var(--encre); border: 5px solid var(--encre); border-left: none; border-radius: 0 26px 26px 0; box-shadow: inset 0 0 0 7px var(--creme), inset 0 0 0 10px #c0392b, 0 16px 34px rgba(0,0,0,0.3); }
  .balade .titre em { color: #c0392b; }

  /* les tirages : une image de la carte, du jeu ou de la balade, dans un cadre crème */
  .tirage { position: absolute; background: var(--creme); padding: 12px; border-radius: 10px; box-shadow: 0 24px 46px rgba(25, 14, 6, 0.4), 0 3px 8px rgba(25, 14, 6, 0.25); box-sizing: border-box; }
  .tirage .im { width: 100%; height: 100%; background-size: cover; border-radius: 4px; }
  .tirage.polaroid { padding: 14px 14px 64px; }
  .tirage .legende { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-family: var(--titre); font-size: 34px; color: var(--encre); }
  .etiquette { position: absolute; font-weight: 900; font-size: 27px; letter-spacing: 1.5px; color: #fff; background: var(--rouge); padding: 7px 16px 8px; border-radius: 8px; box-shadow: 0 6px 14px rgba(0,0,0,0.3); white-space: nowrap; }
  .etiquette.encre { background: var(--encre); }
  .decoupe { position: absolute; filter: drop-shadow(0 20px 22px rgba(20, 12, 5, 0.38)); }
  .rond { position: absolute; border-radius: 50%; background-size: cover; background-position: center; border: 8px solid var(--creme); box-shadow: 0 12px 26px rgba(0,0,0,0.45); box-sizing: border-box; }
  .texte { position: absolute; }
  .fleche { position: absolute; font-family: var(--sans); font-weight: 900; color: var(--vif); line-height: 1; }

  /* la couverture */
  .raisons { position: absolute; left: 0; right: 0; top: 118px; text-align: center; white-space: nowrap; font-family: var(--titre); font-size: 146px; line-height: 1; color: #e0532f; -webkit-text-stroke: 18px var(--creme); paint-order: stroke fill; filter: drop-shadow(0 10px 0 #0e0906); letter-spacing: 2px; }
  .raisons b { font-weight: 400; font-size: 205px; vertical-align: -12px; margin-right: 10px; }
  .sous { position: absolute; left: 0; right: 0; text-align: center; font-weight: 800; font-size: 60px; color: var(--creme); line-height: 1.12; }
  .sous em { font-style: normal; color: var(--vif); }
  .balade .sous { font-family: var(--rond); }

  .sceau { position: absolute; display: grid; place-items: center; text-align: center; background: var(--rouge); color: var(--creme); font-family: var(--titre); border-radius: 18px; box-shadow: inset 0 0 0 6px var(--rouge), inset 0 0 0 9px var(--creme), 0 12px 24px rgba(0,0,0,0.3); line-height: 1; }
  .ruban { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; background: var(--rouge); color: var(--creme); font-weight: 800; padding: 14px 44px 16px; border-radius: 8px; box-shadow: 0 10px 22px rgba(0,0,0,0.3); }
  .koban { position: absolute; width: 150px; height: 230px; border-radius: 50%; background: repeating-linear-gradient(0deg, rgba(150,100,10,0.16) 0 3px, rgba(255,240,170,0) 3px 15px), radial-gradient(ellipse at 36% 28%, #fff6c4 0%, #f2cc4e 34%, #d4a22c 70%, #a8781a 100%); box-shadow: inset 0 0 0 6px #c08d26, inset 0 0 0 9px #f5d872, 0 14px 26px rgba(0,0,0,0.4); display: grid; place-items: center; }
  .koban span { font-family: var(--titre); font-size: 52px; color: #3a2508; writing-mode: vertical-rl; letter-spacing: 6px; }
  .bulle { position: absolute; background: var(--creme); color: var(--encre); border-radius: 26px; padding: 22px 30px 24px; font-weight: 800; font-size: 44px; line-height: 1.15; box-shadow: 0 14px 30px rgba(0,0,0,0.3); text-align: center; }
  .bulle em { font-style: normal; color: var(--rouge); }
</style>
</head>

<script>
const I = (p) => `../../../videos/carte/carrousels/images/${p}`;
const px = (v) => (typeof v === 'number' ? `${v}px` : v);
const mots = (s) => s.replace(/\*([^*]+)\*/g, '<em>$1</em>').replace(/\n/g, '<br>');

// ---------------------------------------------------------------- les pièces
const pose = (e, { x, y, w, h, r = 0, z }) => {
  Object.assign(e.style, { left: px(x), top: px(y) });
  if (w != null) e.style.width = px(w);
  if (h != null) e.style.height = px(h);
  if (r) e.style.transform = `rotate(${r}deg)`;
  if (z != null) e.style.zIndex = z;
  return e;
};
const el = (cls, html = '') => { const e = document.createElement('div'); e.className = cls; e.innerHTML = html; return e; };

/** Un tirage : src (images/…), x, y, w, h, r ; pos (background-position) ; polaroid + legende ; etiquette [texte, x, y, classe]. */
function tirage(o) {
  const e = pose(el(`tirage${o.legende != null ? ' polaroid' : ''}`), o);
  const im = el('im');
  im.style.backgroundImage = `url(${I(o.src)})`;
  im.style.backgroundPosition = o.pos || 'center';
  if (o.taille) im.style.backgroundSize = o.taille;
  e.append(im);
  if (o.legende != null) e.append(el('legende', o.legende));
  if (o.etiquette) {
    const [t, ex, ey, c] = o.etiquette;
    const g = el(`etiquette ${c || ''}`, t);
    Object.assign(g.style, { left: px(ex), top: px(ey) });
    e.append(g);
  }
  return e;
}
function decoupe(o) {
  const e = document.createElement('img');
  e.className = 'decoupe';
  e.src = I(`decoupes/${o.src}.png`);
  pose(e, o);
  if (o.w == null) e.style.width = 'auto';
  if (o.h == null) e.style.height = 'auto';
  if (o.flip) e.style.transform = `${e.style.transform || ''} scaleX(-1)`;
  return e;
}
function rond(o) {
  const e = pose(el('rond'), { ...o, x: o.cx - o.d / 2, y: o.cy - o.d / 2, w: o.d, h: o.d });
  e.style.backgroundImage = `url(${I(o.src)})`;
  if (o.pos) e.style.backgroundPosition = o.pos;
  return e;
}
/** Une couronne de médaillons autour de (cx, cy). */
const couronne = (srcs, cx, cy, rayon, d, depart = -90) => srcs.map((src, i) => {
  const a = (depart + (360 * i) / srcs.length) * Math.PI / 180;
  return { t: 'rond', src, cx: cx + rayon * Math.cos(a), cy: cy + rayon * Math.sin(a), d, pos: src.startsWith('plans/') ? 'center 60%' : 'center' };
});
const texte = (o) => { const e = pose(el(`texte ${o.cls || ''}`, mots(o.html)), o); if (o.style) Object.assign(e.style, o.style); return e; };

      { t: 'tirage', src: F('c-aogashima'), x: 600, y: 600, w: 420, h: 620, r: 4, pos: 'center 48%', etiquette: ['AOGASHIMA', 22, 22] },

  balade: [

  // ======================================================== le jeu « Guess the place »
  jeu: [

// ---------------------------------------------------------------- dessiner une image
const q = new URLSearchParams(location.search);
const nom = q.get('c') || 'carte', n = Number(q.get('n') || 0);
const def = CARROUSELS[nom][n];
const racine = document.getElementById('image');
racine.className = `image ${def.fond} ${nom}`;
racine.append(el('grille'), el('grain'), el('halo'));
if (!def.couverture && !def.fin) {
  racine.append(el('num haut', String(n)), el('num bas', String(n)));
}
if (def.titre) racine.append(el('titre', mots(def.titre)));
for (const o of def.elements) {
  if (o.t === 'tirage') racine.append(tirage(o));
  else if (o.t === 'decoupe') racine.append(decoupe(o));
  else if (o.t === 'rond') racine.append(rond(o));
  else if (o.t === 'texte') racine.append(texte(o));
  else if (o.t === 'html') racine.insertAdjacentHTML('beforeend', o.html);
}
window.__nombre = Object.fromEntries(Object.entries(CARROUSELS).map(([k, v]) => [k, v.length]));
// prêt quand les polices et toutes les images (y compris les fonds CSS) sont chargées
const urls = new Set();
for (const e of racine.querySelectorAll('*')) {
  const b = getComputedStyle(e).backgroundImage;
  for (const m of b.matchAll(/url\("?([^")]+)"?\)/g)) urls.add(m[1]);
  if (e.tagName === 'IMG') urls.add(e.src);
}
Promise.all([document.fonts.ready, ...[...urls].map((u) => new Promise((ok) => { const im = new Image(); im.onload = im.onerror = ok; im.src = u; }))])
  .then(() => document.fonts.ready).then(() => { window.__pret = true; });
