<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="/atelier/commun.css">
<style>
@page { size: A4; margin: 0; }
.feuille { width: 210mm; height: 297mm; background-image: url(grain.jpg); background-size: 240px; } /* le grain en carreau : bien plus léger dans le PDF que le filtre SVG */
.entete { position: absolute; top: 12mm; left: 15mm; right: 15mm; display: flex; justify-content: space-between; align-items: baseline; gap: 6mm; }
.entete .titre { font-size: 17pt; }
.entete .italique { font-size: 11pt; color: var(--encre-douce); text-align: right; }
/* le carré à découper : 180 mm, les traits de coupe aux coins */
.carre { position: absolute; top: 27mm; left: 15mm; width: 180mm; height: 180mm; }
.carre svg { display: block; width: 180mm; height: 180mm; }
.coupe { position: absolute; top: 27mm; left: 15mm; width: 180mm; height: 180mm; pointer-events: none; }
.coupe i { position: absolute; background: var(--encre-douce); }
.sous { position: absolute; top: 213mm; left: 15mm; right: 15mm; display: grid; gap: 4mm; }
.sous .consigne { font-size: 10.5pt; line-height: 1.5; margin: 0; }
.sous .motif { font-size: 10.5pt; line-height: 1.55; margin: 0; padding: 4mm 5mm; background: rgba(239, 228, 200, .7); box-shadow: inset 1mm 0 0 rgba(138, 107, 69, .6); }
.sous .motif b { font-family: var(--police-titre); font-weight: 400; color: var(--rouge); font-size: 12pt; }
.pied { position: absolute; bottom: 10mm; left: 15mm; right: 15mm; display: flex; justify-content: space-between; align-items: center; font-size: 8pt; color: var(--encre-douce); }
/* la page du pliage */
.pliage { position: absolute; inset: 13mm 14mm 18mm; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 3.5mm; }
.pliage .titre { font-size: 20pt; }
.pliage .intro { font-size: 10pt; line-height: 1.5; margin: 0; }
.etapes { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 3mm 4mm; } /* minmax : sinon les dessins gardent leur hauteur et la 4e rangée sort de la page */
.etape { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 1.6mm; min-height: 0; }
.etape svg { width: 100%; height: 100%; min-height: 0; background: #fbf6ea; border: .3mm solid rgba(138, 107, 69, .45); }
.etape p { margin: 0; font-size: 8.6pt; line-height: 1.38; }
.etape b { font-family: var(--police-titre); font-weight: 400; color: var(--rouge); font-size: 12pt; margin-right: 1.6mm; }
.legende { display: flex; gap: 7mm; font-size: 8pt; color: var(--encre-douce); align-items: center; }
.legende svg { width: 14mm; height: 3mm; vertical-align: middle; margin-right: 1.5mm; }
/* la page 4 : l'étape 9 pas à pas (six grands dessins) */
.detail { grid-template-rows: auto auto minmax(0, 1fr) auto; }
.detail .titre { font-size: 18pt; }
.detail .etapes { grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 5mm 5mm; }
.detail .etape { gap: 2mm; }
.detail .etape p { font-size: 9.4pt; line-height: 1.42; }
.detail .etape b { font-size: 13pt; }
.detail svg text { font-family: var(--police); }
.astuce { font-size: 10pt; line-height: 1.5; margin: 0; padding: 3.5mm 5mm; background: rgba(239, 228, 200, .7); box-shadow: inset 1mm 0 0 rgba(168, 50, 31, .55); }
.astuce b { color: var(--rouge); }
</style></head>
<body>
<section class="feuille" id="f1"></section>
<section class="feuille" id="f2"></section>
<section class="feuille"><div class="filet"></div>
  <div class="pliage">
    <h1 class="titre" id="p-titre"></h1>
    <div><p class="intro" id="p-intro"></p><div class="legende" id="legende"></div></div>
    <div class="etapes" id="etapes"></div>
  </div>
  <div class="pied"><span></span><span class="marque"><img src="/img/logo.jpg" alt="">map.randomjapanplace.com</span></div>
</section>
<section class="feuille"><div class="filet"></div>
  <div class="pliage detail">

    <div class="etapes" id="d-etapes"></div>
    <p class="astuce" id="d-astuce"></p>
  </div>
  <div class="pied"><span></span><span class="marque"><img src="/img/logo.jpg" alt="">map.randomjapanplace.com</span></div>
</section>

    pIntro: 'The crane is Japan’s most famous fold. In Japan, people fold a thousand cranes (senbazuru) to make a wish. Press each fold well with a fingernail.',

    dTitre: 'Step 9, step by step: the neck and the tail',
    dIntro: 'This is the hardest fold of the crane (the « reverse fold »): the point goes up inside, between two layers. First crease the fold on the outside, then do it for real. Take your time.',
    cou: 'neck', queue: 'tail',

      '両方の羽を下に折ります（表と裏）。',

    dIntro: '鶴でいちばん難しいところです（中割り折り）。先を2枚のあいだに入れて、上へ折り上げます。まず外側に折って折り目をつけ、それから本番です。ゆっくりで大丈夫。',

    details: [

      '左の先を、手前に、ななめ上へ折ります。先が左上、鶴の上のほうまで来るように。爪でしっかり折り目をつけて開きます。うしろ側にも同じように折って開きます。',

  },

const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------- les deux feuilles à découper
const S = 180; // mm
function seigaiha() {
  const R = 11, out = [];
  for (let j = -1; j <= Math.ceil(S / (R / 2)) + 2; j++) {
    const cy = j * R / 2, dx = j % 2 ? R : 0;
    for (let i = -1; i <= S / (2 * R) + 1; i++) {
      const cx = i * 2 * R + dx;
      out.push(`<circle cx="${cx}" cy="${cy}" r="${R}" fill="#1d5652" stroke="#9cc7bd" stroke-width=".7"/>`);
      for (const [k, f] of [[0.8, '#1d5652'], [0.6, '#245f5a'], [0.4, '#1d5652'], [0.2, '#8fbab2']])
        out.push(`<circle cx="${cx}" cy="${cy}" r="${R * k}" fill="${f}" stroke="#9cc7bd" stroke-width=".6"/>`);
    }
  }
  return `<rect width="${S}" height="${S}" fill="#1d5652"/>${out.join('')}`;
}
function asanoha() {
  const s = 20, hh = s * Math.sqrt(3) / 2, lignes = [];
  const v = (i, r) => [i * s + (r % 2 ? s / 2 : 0), r * hh];
  const tri = (a, b, c) => {
    const g = [(a[0] + b[0] + c[0]) / 3, (a[1] + b[1] + c[1]) / 3];
    for (const [p, q] of [[a, b], [b, c], [c, a]]) lignes.push(`M${p[0].toFixed(2)} ${p[1].toFixed(2)}L${q[0].toFixed(2)} ${q[1].toFixed(2)}`);
    for (const p of [a, b, c]) lignes.push(`M${p[0].toFixed(2)} ${p[1].toFixed(2)}L${g[0].toFixed(2)} ${g[1].toFixed(2)}`);
  };
  for (let r = -1; r <= S / hh + 1; r++) for (let i = -1; i <= S / s + 1; i++) {
    const a = v(i, r), b = v(i + 1, r), c = r % 2 ? v(i + 1, r + 1) : v(i, r + 1), d = r % 2 ? v(i, r + 1) : v(i - 1, r + 1);
    tri(a, b, c); tri(a, c, d);
  }
  return `<rect width="${S}" height="${S}" fill="#a8321f"/><path d="${lignes.join('')}" stroke="#f0dcae" stroke-width=".55" fill="none" stroke-linecap="round"/>`;
}
function feuille(el, n, dessin) {
  const marques = [];
  for (const [x, y] of [[0, 0], [S, 0], [0, S], [S, S]]) {
    const ox = x ? 1 : -1, oy = y ? 1 : -1;
    marques.push(`<i style="left:${x + (ox > 0 ? 1.5 : -7.5)}mm;top:${y - .15}mm;width:6mm;height:.3mm"></i><i style="left:${x - .15}mm;top:${y + (oy > 0 ? 1.5 : -7.5)}mm;width:.3mm;height:6mm"></i>`);
  }
  el.innerHTML = `<div class="entete"><h1 class="titre">${T.titre}</h1><span class="italique">${T.feuille(n)} · ${T.noms[n - 1]}</span></div>
    <div class="carre"><svg viewBox="0 0 ${S} ${S}"><defs><clipPath id="c${n}"><rect width="${S}" height="${S}"/></clipPath></defs><g clip-path="url(#c${n})">${dessin}</g><rect x=".1" y=".1" width="${S - .2}" height="${S - .2}" fill="none" stroke="#35251a" stroke-width=".25"/></svg></div>
    <div class="coupe">${marques.join('')}</div>
    <div class="sous"><p class="consigne">${T.consigne}</p><p class="motif">${T.motifs[n - 1]}</p></div>
    <div class="pied"><span></span><span class="marque"><img src="/img/logo.jpg" alt="">map.randomjapanplace.com</span></div>`;
}
feuille($('f1'), 1, seigaiha());
feuille($('f2'), 2, asanoha());

// ---------------------------------------------------------------- le pliage de la grue : la géométrie, calculée
// (le carré de côté 2, posé en losange ; y vers le bas)
const r2 = Math.SQRT2, h = Math.SQRT1_2;
const add = (a, b) => [a[0] + b[0], a[1] + b[1]], sub = (a, b) => [a[0] - b[0], a[1] - b[1]], mul = (a, k) => [a[0] * k, a[1] * k];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1], norm = (a) => mul(a, 1 / Math.hypot(...a)), croix = (a, b) => a[0] * b[1] - a[1] * b[0];
const sym = ([x, y]) => [-x, y];
/** Le reflet de p par rapport à la droite (a, b). */
function reflet(p, a, b) { const u = norm(sub(b, a)), d = sub(p, a); return add(a, sub(mul(u, 2 * dot(d, u)), d)); }
/** L'intersection des droites (a, b) et (c, d). */
function inter(a, b, c, d) { const r = sub(b, a), s = sub(d, c), t = croix(sub(c, a), s) / croix(r, s); return add(a, mul(r, t)); }
/** Le polygone coupé par la droite (a, b) : on garde le côté gauche (croix ≥ 0). */
function couper(poly, a, b) {
  const out = [], cote = (p) => croix(sub(b, a), sub(p, a));
  poly.forEach((p, i) => {
    const q = poly[(i + 1) % poly.length], cp = cote(p), cq = cote(q);
    if (cp >= 0) out.push(p);
    if ((cp >= 0) !== (cq >= 0)) out.push(inter(p, q, a, b));
  });
  return out;
}
const DIAM = [[0, -r2], [r2, 0], [0, r2], [-r2, 0]];
// la base carrée : T le centre de la feuille (en haut), B les quatre coins (en bas)
const Tb = [0, -h], Lb = [-h, 0], Bb = [0, h], Rb = [h, 0];
const PL = [-(r2 - 1), h - 1], PR = sym(PL), Lp = [0, h - 1];        // les plis du cerf-volant (étape 4)
const Bh = [0, 2 * (h - 1) - h];                                     // la pointe soulevée (étape 6)
const OISEAU = [Bh, PL, Bb, PR];                                     // la base de l'oiseau
// étape 8 : les bords du bas sur le milieu (la bissectrice depuis B)
const QL = inter(Bb, add(Bb, add(norm(sub(PL, Bb)), [0, -1])), PL, Bh), QR = sym(QL);
const PLr = reflet(PL, Bb, QL);
const FIN = [Bh, QL, Bb, QR];                                        // la base affinée
// étape 9 : le cou (à gauche) et la queue (à droite), pliés vers le haut à l'intérieur, à 65° de l'horizontale
const yC = -0.22, dCou = [-Math.cos(65 * Math.PI / 180), -Math.sin(65 * Math.PI / 180)];
const uPli = norm(add([0, 1], dCou)), C0 = [0, yC], C1 = add(C0, uPli);
const EL = inter(C0, C1, QL, Bb), ER = sym(EL);
// la jambe gauche (sous le pli, à gauche du milieu) est le triangle EL, B, C0 : son reflet est le cou
const pointe = reflet(Bb, C0, EL);
