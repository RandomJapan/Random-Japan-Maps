<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Random Japan Place · 3D Map of Japan</title>
  <meta name="description" content="Every place from the Random Japan Place TikToks on an interactive 3D map of Japan: shrines, temples, castles, mountains, waterfalls and more.">
  <meta name="theme-color" content="#efe4c8">
  <link rel="canonical" href="https://map.randomjapanplace.com/">
  <meta property="og:title" content="Random Japan Place · 3D Map of Japan">
  <meta property="og:description" content="Every place from my TikToks on an interactive 3D map of Japan.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://map.randomjapanplace.com/">
  <meta property="og:image" content="https://map.randomjapanplace.com/img/partage.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/icone-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Les serveurs appelés dès le démarrage (MapLibre, le tableau Google Sheets, les tuiles du relief) : la connexion
       s'ouvre pendant que la page se charge. « crossorigin » : ces fichiers sont demandés sans cookies (modules, fetch). -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://docs.google.com" crossorigin>
  <link rel="preconnect" href="https://tiles.mapterhorn.com" crossorigin>
  <!-- Les polices (119 Ko de description, surtout le japonais) se chargent sans retarder le démarrage de la carte :
       un style « print » ne bloque rien, puis il passe à « all » dès qu'il est arrivé. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Antique&family=IM+Fell+English:ital@0;1&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.11.2/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="legendes.css">
</head>
<body>
  <div id="carte" aria-label="3D map of Japan"></div>
  <!-- Papier vieilli : app.js le glisse dans la carte, par-dessus le relief mais sous les lieux -->
  <div class="papier" id="papier" aria-hidden="true"></div>

  <header class="entete panneau">
    <a class="marque" id="lien-profil" target="_blank" rel="noopener" data-t-titre="suivre">
      <img class="logo" id="logo" alt="" width="44" height="44">
      <div class="marque-textes">
        <h1 class="titre" id="titre">Random Japan Place</h1>
        <span class="sous-titre" data-t="sousTitre"></span>
      </div>
    </a>
    <!-- Compteur de visites (compteur.js), sur ordinateur seulement -->
    <div class="visites" id="visites" hidden>
      <span class="visites-nombre" id="visites-nombre"></span>
      <span class="visites-mot" id="visites-mot"></span>
    </div>
  </header>

  <div class="filtres">
    <div class="filtres-boutons">
      <button class="bouton-categories panneau" id="btn-categories" aria-expanded="false" aria-controls="menu-categories">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 5h18v2H3zm3 6h12v2H6zm3 6h6v2H9z"/></svg>
        <span data-t="categories">Categories</span>
        <span class="compteur" id="compteur"></span>
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></svg>
      </button>
      <button class="bouton-categories bouton-hasard panneau" id="btn-hasard" aria-expanded="false" aria-controls="panneau-hasard">
        <svg class="de" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="8.5" r="1.6" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.6" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.6" fill="currentColor"/></svg>
        <span data-t="hasard">Random</span>
      </button>
      <!-- Les balades 3D : tous les lieux où l'on se promène en 3D (site/balade/), sans avoir à les chercher sur la carte -->
      <button class="bouton-categories bouton-balades panneau" id="btn-balades" aria-expanded="false" aria-controls="panneau-balades" data-t-titre="baladesTitre">
        <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9Z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></g></svg>
        <span class="texte-bouton" data-t="balades">3D walks</span>
        <span class="texte-court" aria-hidden="true">3D</span>
      </button>
      <!-- Visite guidée (visite.js) -->
      <button class="bouton-categories bouton-visite panneau" id="btn-visite" aria-expanded="false" aria-controls="panneau-visite" data-t-titre="visiteTitre">
        <svg class="camera" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M3 7.5h11.5v9H3zM14.5 10.5l6-3v9l-6-3"/></svg>
        <span class="texte-bouton" data-t="visite">Tour</span>
      </button>
      <!-- Quand partir ? Les lieux à leur plus beau chaque mois (saisons.js) -->
      <button class="bouton-categories bouton-saisons panneau" id="btn-saisons" aria-expanded="false" aria-controls="panneau-saisons" data-t-titre="saisonsTitre">
        <svg class="calendrier" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M3.5 10h17M8 3v4M16 3v4"/><path fill="currentColor" d="M12 12.2c1.4 1.2 2.7 1.6 2.7 3.3a2.7 2.7 0 0 1-5.4 0c0-1.7 1.3-2.1 2.7-3.3Z"/></svg>
        <span class="texte-bouton" data-t="saisonsBouton">When to go</span>
      </button>
      <!-- Halloween : seulement pendant l'événement (halloween.js, CONFIG.halloween) -->
      <button class="bouton-categories bouton-halloween panneau" id="btn-halloween" aria-expanded="false" aria-controls="panneau-halloween" hidden>
        <svg class="citrouille" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 6.4C11.6 4.6 12.2 3.2 13.8 2.4"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 6.6C10.4 5.7 8.4 5.6 6.7 6.5 3.9 7.8 2.6 10.7 2.8 13.7 3.1 17.3 5.4 20.1 8.4 20.6 9.7 20.8 10.9 20.5 12 19.9 13.1 20.5 14.3 20.8 15.6 20.6 18.6 20.1 20.9 17.3 21.2 13.7 21.4 10.7 20.1 7.8 17.3 6.5 15.6 5.6 13.6 5.7 12 6.6Z"/><path fill="none" stroke="currentColor" stroke-width="1.6" d="M12 6.8C10.4 10.4 10.4 16.4 12 19.8"/></svg>
        <span class="texte-bouton" id="txt-halloween">Halloween</span>
        <span class="compteur" id="compteur-halloween"></span>
      </button>
      <!-- Favoris : le bouton apparaît dès qu'on a mis un cœur sur un lieu -->
      <button class="bouton-categories bouton-favoris panneau" id="btn-favoris" aria-expanded="false" aria-controls="panneau-favoris" hidden data-t-titre="favorisTitre">
        <svg class="coeur" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 20.3s-7.4-4.5-9.2-9.1C1.5 7.8 3.7 4.6 7 4.6c2 0 3.6 1.1 5 2.9 1.4-1.8 3-2.9 5-2.9 3.3 0 5.5 3.2 4.2 6.6-1.8 4.6-9.2 9.1-9.2 9.1Z"/></svg>
        <span class="texte-bouton" data-t="favoris">Favorites</span>
        <span class="compteur" id="compteur-favoris"></span>
      </button>
      <!-- L'itinéraire des favoris quand il est sur la carte et le panneau fermé : son total (un appui rouvre le détail) et × (itineraire.js) -->
      <div class="resume-itineraire panneau" id="resume-itineraire" hidden>
        <button type="button" class="resume-details" id="resume-details" data-t-titre="voirItineraire"></button>
        <!-- Partager son voyage : un lien et une image à poster (partage-voyage.js) -->
        <button type="button" class="resume-partager" id="resume-partager" data-t-titre="partagerVoyage"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></svg><span data-t="partagerCourt">Share</span></button>
        <button type="button" class="resume-effacer" id="resume-effacer" data-t-titre="effacerItineraire" data-t-aria="effacerItineraire"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M7 7l10 10M17 7 7 17"/></svg></button>
      </div>
      <!-- Le mois montré sur la carte (les autres lieux s'effacent) : un appui rouvre le calendrier, × montre tout -->
      <div class="resume-itineraire resume-saison panneau" id="resume-saison" hidden>
        <button type="button" class="resume-details" id="saison-details" data-t-titre="saisonsTitre"></button>
        <button type="button" class="resume-effacer" id="saison-effacer" data-t-titre="saisonsEffacer" data-t-aria="saisonsEffacer"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M7 7l10 10M17 7 7 17"/></svg></button>
      </div>
      <!-- Légendes cachées : le bouton apparaît quand on en a trouvé une (legendes.js) -->
      <button class="bouton-categories bouton-legendes panneau" id="btn-legendes" aria-expanded="false" aria-controls="panneau-legendes" hidden>
        <svg class="lanterne" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 3h6M9 21h6M7.5 5h9C19 7 19.6 10 19.6 12s-.6 5-3.1 7h-9C5 17 4.4 14 4.4 12S5 7 7.5 5ZM4.6 10h14.8M4.6 14h14.8"/></svg>
        <span id="txt-legendes">Legends</span>
        <span class="compteur" id="compteur-legendes"></span>
      </button>
      <!-- Jeu « Devine le lieu » : pas encore public, seulement en mode développeur (jeu.js) -->
      <button class="bouton-categories bouton-jeu panneau dev" id="btn-jeu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 21.2s-6.6-6.7-6.6-11.6a6.6 6.6 0 0 1 13.2 0c0 4.9-6.6 11.6-6.6 11.6Z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M10.2 8.1a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3"/><circle cx="12" cy="13.2" r="1" fill="currentColor"/></svg>
        <span class="texte-bouton" data-t="jeu">Guess the place</span>
      </button>
      <!-- Défi du jour : un lieu mystère par jour, pas encore public non plus (defi.js) ; le point rouge : pas encore joué aujourd'hui -->
      <button class="bouton-categories bouton-defi panneau dev" id="btn-defi" data-t-titre="defiTitre">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M3.5 10h17M8 3v4M16 3v4"/><path fill="currentColor" d="m12 11.6 1.1 2.3 2.5.3-1.8 1.7.5 2.5-2.3-1.2-2.3 1.2.5-2.5-1.8-1.7 2.5-.3Z"/></svg>
        <span class="texte-bouton" data-t="defi">Daily</span>
        <span class="defi-point" id="defi-point" hidden></span>
      </button>
    </div>
    <div class="menu panneau" id="panneau-balades" hidden></div>
    <div class="menu panneau" id="panneau-legendes" hidden></div>
    <div class="menu panneau halloween-panneau" id="panneau-halloween" hidden></div>
    <div class="menu panneau" id="panneau-favoris" hidden></div>
    <div class="menu panneau hasard" id="panneau-saisons" hidden></div>
    <div class="menu panneau hasard" id="panneau-visite" hidden>
      <!-- Trois onglets : la visite guidée, le plongeon sur un nouveau lieu (pour le début des vidéos) et le vol
           d'un point à un autre (le même volet, avec un départ en plus).
           Le plongeon, le point à point et les onglets n'existent qu'en mode développeur. -->
      <div class="onglets dev" role="tablist">
        <button type="button" role="tab" id="onglet-visite" aria-selected="true" aria-controls="volet-visite" data-t="visiteOnglet">Tour</button>
        <button type="button" role="tab" id="onglet-plongeon" aria-selected="false" aria-controls="volet-plongeon" data-t="plongeonOnglet">Dive</button>
        <button type="button" role="tab" id="onglet-point" aria-selected="false" aria-controls="volet-plongeon" data-t="pointOnglet">Point to point</button>
      </div>
      <div id="volet-visite" role="tabpanel" aria-labelledby="onglet-visite">
      <p class="hasard-titre" data-t="visiteTitre"></p>
      <p class="panneau-info" data-t="visiteInfo"></p>
      <label class="champ-hasard">
        <span data-t="region"></span>
        <select id="visite-region"></select>
      </label>
      <label class="champ-hasard">
        <span data-t="type"></span>
        <select id="visite-type"></select>
      </label>
      <label class="case-option" id="ligne-visite-favoris" hidden>
        <input type="checkbox" id="visite-favoris">
        <span data-t="visiteSeulementFavoris"></span>
      </label>
      <label class="champ-hasard">
        <span data-t="visiteDuree"></span>
        <select id="visite-duree">
          <option value="4000" data-t="dureeCourte"></option>
          <option value="7000" selected data-t="dureeNormale"></option>
          <option value="11000" data-t="dureeLongue"></option>
        </select>
      </label>
      <label class="case-option">
        <input type="checkbox" id="visite-video" checked>
        <span data-t="visiteVideo"></span>
      </label>
      <label class="case-option sous-option">
        <input type="checkbox" id="visite-son">
        <span data-t="visiteSon"></span>
      </label>
      <label class="case-option">
        <input type="checkbox" id="visite-film" checked>
        <span data-t="visiteFilm"></span>
      </label>
      <button type="button" class="btn-lancer" id="btn-visite-lancer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5.5v13a1 1 0 0 0 1.5.9l10.5-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5Z"/></svg>
        <span id="txt-visite-lancer"></span>
      </button>
      </div>
      <div id="volet-plongeon" class="dev" role="tabpanel" aria-labelledby="onglet-plongeon" hidden>
        <p class="panneau-info" id="plongeon-info"></p>
        <div class="seul-point">
          <p class="plongeon-etape" data-t="pointDepart"></p>
          <label class="champ-hasard">
            <span data-t="plongeonPosition"></span>
            <input type="text" id="plongeon-depart" placeholder="34.6851, 135.8048" autocomplete="off" spellcheck="false">
          </label>
          <p class="plongeon-erreur" id="plongeon-depart-erreur" role="alert" hidden></p>
          <label class="champ-hasard">
            <span data-t="pointNomDepart"></span>
            <input type="text" id="plongeon-depart-nom" autocomplete="off">
          </label>
          <label class="champ-hasard">
            <span data-t="plongeonNomJa"></span>
            <input type="text" id="plongeon-depart-nom-ja" lang="ja" autocomplete="off">
          </label>
          <label class="champ-hasard">
            <span data-t="plongeonType"></span>
            <select id="plongeon-depart-type"></select>
          </label>
          <p class="plongeon-etape" data-t="pointArrivee"></p>
        </div>
        <label class="champ-hasard">
          <span data-t="plongeonPosition"></span>
          <input type="text" id="plongeon-position" placeholder="34.1302, 133.5345" autocomplete="off" spellcheck="false">
        </label>
        <p class="plongeon-aide" data-t="plongeonAideGps"></p>
        <p class="plongeon-erreur" id="plongeon-erreur" role="alert" hidden></p>
        <label class="champ-hasard">
          <span data-t="plongeonNom"></span>
          <input type="text" id="plongeon-nom" autocomplete="off">
        </label>
        <label class="champ-hasard">
          <span data-t="plongeonNomJa"></span>
          <input type="text" id="plongeon-nom-ja" lang="ja" autocomplete="off">
        </label>
        <label class="champ-hasard">
          <span data-t="plongeonType"></span>
          <select id="plongeon-type"></select>
        </label>
        <div class="plongeon-reglages">
          <label class="champ-hasard">
            <span data-t="plongeonDistance"></span>
            <select id="plongeon-distance">
              <option value="14" data-t="distanceTresPres"></option>
              <option value="13" selected data-t="distancePres"></option>
              <option value="12" data-t="distanceLarge"></option>
            </select>
          </label>
          <label class="champ-hasard">
            <span data-t="plongeonOrbite"></span>
            <select id="plongeon-orbite">
              <option value="0" data-t="orbiteSans"></option>
              <option value="5" data-t="orbiteLente"></option>
              <option value="10" selected data-t="orbiteNormale"></option>
              <option value="18" data-t="orbiteRapide"></option>
            </select>
          </label>
        </div>
        <label class="case-option case-enregistrer">
          <input type="checkbox" id="plongeon-enregistrer">
          <span data-t="plongeonEnregistrer"></span>
        </label>
        <label class="champ-hasard champ-format">
          <span data-t="plongeonFormat"></span>
          <select id="plongeon-format">
            <option value="16:9" selected data-t="formatHorizontal"></option>
            <option value="9:16" data-t="formatVertical"></option>
          </select>
        </label>
        <p class="plongeon-aide" data-t="plongeonEnregistrerAide"></p>
        <button type="button" class="btn-lancer" id="btn-plongeon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M3 7.5h11.5v9H3zM14.5 10.5l6-3v9l-6-3"/></svg>
          <span id="txt-plongeon-lancer"></span>
        </button>
        <button type="button" class="btn-secondaire btn-affiche" id="btn-affiche">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M3.5 6.5h17v11h-17zM7 6.5v11M10 10.5h7M10 13.5h4.5"/></svg>
          <span data-t="plongeonAffiche"></span>
        </button>
        <p class="plongeon-aide plongeon-aide-affiche" data-t="plongeonAfficheAide"></p>
      </div>
    </div>
    <div class="menu panneau hasard" id="panneau-hasard" hidden>
      <p class="hasard-titre" id="hasard-titre" data-t="hasardTitre"></p>
      <label class="champ-hasard">
        <span data-t="region"></span>
        <select id="choix-region"></select>
      </label>
      <label class="champ-hasard">
        <span data-t="type"></span>
        <select id="choix-type"></select>
      </label>
      <button type="button" class="btn-lancer" id="btn-lancer">
        <svg class="de" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="8.5" r="1.6" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.6" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.6" fill="currentColor"/></svg>
        <span data-t="lancer"></span>
      </button>
      <p class="hasard-info" id="hasard-info"></p>
    </div>
    <div class="menu panneau" id="menu-categories" hidden>
      <label class="recherche">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="m20 20-4.5-4.5M17 10.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z"/></svg>
        <input type="search" id="recherche" autocomplete="off" spellcheck="false" data-t-aria="chercherCourt">
      </label>
      <ul class="resultats" id="resultats" hidden></ul>
      <div class="menu-actions" id="menu-actions">
        <button type="button" id="btn-tout" data-t="tout"></button>
        <button type="button" id="btn-rien" data-t="rien"></button>
      </div>
      <ul class="liste-categories" id="liste-categories"></ul>
      <!-- Les pages des lieux (outils/fabriquer_pages.py) ; la langue est mise par app.js -->
      <a class="lien-liste" id="lien-liste" href="en/" data-t="listeLieux">All places, as a list</a>
    </div>
  </div>

  <nav class="langues panneau" id="langues" aria-label="Language">
    <button type="button" data-langue="en">EN</button>
    <button type="button" data-langue="fr">FR</button>
    <button type="button" data-langue="ja">日本語</button>
  </nav>

  <!-- Lecteur de musique (musique.js) : coupé au départ ; le bouton ouvre le choix du style et de l'ambiance -->
  <div class="musique" id="musique">

  <!-- Filet de secours (2026-10-09) : si la carte n'a pas démarré au bout de 20 s (un fichier qui n'arrive pas,
       une erreur dans ce navigateur), on le dit au lieu de laisser tourner le logo, avec un bouton pour recharger
       et la première erreur en petit, pour pouvoir comprendre ce qui bloque. Un script classique : il marche même
       si les modules de la carte ne se chargent pas. -->
  <script>
    (function () {
      var erreurs = [];
      addEventListener('error', function (e) {
        var cible = e.target && (e.target.src || e.target.href);
        if (cible && cible.indexOf('zgo.at') >= 0) return; // le compteur de visites, souvent bloqué : sans importance
        erreurs.push(e.message || (cible ? 'Fichier non chargé : ' + cible : 'Erreur'));
      }, true);
      addEventListener('unhandledrejection', function (e) {
        erreurs.push(String((e.reason && e.reason.message) || e.reason));
      });
      setTimeout(function () {
        var ecran = document.getElementById('chargement');
        if (!ecran || ecran.classList.contains('fini') || ecran.querySelector('.chargement-secours')) return;
        var l = '';
        try { l = localStorage.getItem('langue') || ''; } catch (e) { /* navigation privée */ }
        l = l || (navigator.language || '').slice(0, 2);
        var txt = {
          fr: ['La carte met trop de temps à se charger.', 'Recharger'],
          ja: ['地図の読み込みに時間がかかっています。', '再読み込み'],
