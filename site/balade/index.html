<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#3a3236">
  <title>Balade 3D · Random Japan Place</title>
  <link rel="icon" href="../img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="balade.css">
</head>
<body>
  <canvas id="jeu"></canvas>
  <div class="vapeur-ecran" aria-hidden="true"></div>
  <svg class="jumelles-ecran" aria-hidden="true"><defs><mask id="jumelles-trous"><rect width="100%" height="100%" fill="#fff"/><circle class="j1" fill="#000"/><circle class="j2" fill="#000"/></mask></defs><rect width="100%" height="100%" fill="#14110f" mask="url(#jumelles-trous)"/></svg>

  <header class="titre cadre">
    <a class="retour" href="../">←</a>
    <div><b class="titre-nom"></b><span class="titre-ja"></span></div>
  </header>
  <div class="boutons-haut">
    <button class="btn-carnet cadre" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M8 12.5l2.6 2.6L16.4 9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square"/></svg>
      <span class="carnet-n">0/5</span>
    </button>
    <button class="btn-tenue cadre" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7.6V6.7a2.2 2.2 0 1 0-2.2-2.2" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/><path d="M12 7.7l9 8a1.4 1.4 0 0 1-.9 2.4H3.9a1.4 1.4 0 0 1-.9-2.4z" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"/></svg></button>
    <button class="btn-menu cadre" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2.8"/></svg></button>
  </div>

  <div class="bulle-action" hidden><kbd>A</kbd><span></span></div>
  <p class="aide"></p>

  <div class="dialogue cadre" hidden>
    <div class="dialogue-nom" hidden></div>
    <p class="dialogue-texte"></p>
    <span class="dialogue-suite" hidden>▼</span>
  </div>
  <div class="dialogue-choix cadre" hidden></div>

  <div class="joystick" aria-hidden="true"><span></span></div>
  <button class="bouton-a" type="button" aria-label="A">A</button>

  <div class="tampon-obtenu" hidden></div>
  <div class="fond-carnet voile" hidden>
    <div class="carnet cadre"><button class="fermer" type="button" aria-label="×">×</button><div class="carnet-contenu"></div></div>
  </div>
  <div class="fond-menu voile" hidden><div class="menu cadre"></div></div>
  <div class="garde-robe cadre" hidden></div>
  <div class="boutique cadre" hidden></div>
  <div class="feuille" hidden></div>
  <div class="voyage" hidden></div>
  <div class="photo" hidden></div>
  <div class="fond-video voile" hidden>
    <div class="cadre-video cadre">
      <p class="video-titre"></p>
      <div class="video-lecteur"></div>
      <a class="video-lien" target="_blank" rel="noopener"></a>
      <button class="video-fermer" type="button"></button>
    </div>
  </div>

  <div class="chargement"><div class="cadre"><span class="sablier"></span><p></p></div></div>
  <script>
    // Si la balade ne peut pas démarrer (un appareil sans WebGL 2 ; reseau : three.js ou un module injoignable) : un
    // mot et le retour à la carte, plutôt qu'un sablier sans fin (depuis qu'elle est pour tous, 2026-10-26). Une
    // erreur pendant le chargement qui ne l'empêche pas s'efface avec lui.
    function echecBalade(reseau) {
      const ch = document.querySelector('.chargement');
      if (ch.hidden || ch.classList.contains('echec')) return;
      const TEXTES = {
        en: ['This device can’t show the 3D walk.', 'The 3D walk couldn’t load. Check your connection and try again.', 'Back to the map'],
        fr: ['Ton appareil ne peut pas afficher la balade en 3D.', 'La balade en 3D n’a pas pu se charger. Vérifie ta connexion et réessaie.', 'Retour à la carte'],
        ja: ['この端末では3Dおさんぽを表示できません。', '3Dおさんぽを読みこめませんでした。接続をたしかめて、もう一度ためしてください。', '地図にもどる'],
      };
      let langue = new URLSearchParams(location.search).get('langue');
      try { if (!TEXTES[langue]) langue = localStorage.getItem('langue'); } catch { /* navigation privée */ }
      if (!TEXTES[langue]) langue = String(navigator.language || 'en').slice(0, 2).toLowerCase();
      const [appareil, connexion, retour] = TEXTES[langue] || TEXTES.en;
      ch.classList.add('echec');
      ch.querySelector('p').textContent = reseau ? connexion : appareil;
      const lien = document.createElement('a');
      lien.href = '../';
      lien.textContent = retour;
      ch.querySelector('.cadre').append(lien);
    }
    addEventListener('error', () => echecBalade(false));
  </script>
  <script type="module" src="balade.js" onerror="echecBalade(true)"></script>
</body>
</html>
